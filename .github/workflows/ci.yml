name: ServiceHub CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


# ==========================================
# BACKEND CHECK
# ==========================================

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servicehub-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check src/server.js


# ==========================================
# FRONTEND BUILD
# ==========================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servicehub-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub-frontend/package-lock.json

      - name: Setup npm
        run: npm install -g npm@10.9.2

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build


# ==========================================
# DOCKER BUILD & PUSH
# ==========================================

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------
      # Check Docker Hub Secrets
      # --------------------------------------

      - name: Check Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is EMPTY"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "DOCKERHUB_TOKEN is EMPTY"
            exit 1
          fi

          echo "DOCKERHUB_USERNAME is set"
          echo "DOCKERHUB_TOKEN is set"

          case "$DOCKERHUB_TOKEN" in
            dckr_pat_*)
              echo "Docker Hub token prefix looks correct"
              ;;
            *)
              echo "Docker Hub token does NOT start with dckr_pat_"
              exit 1
              ;;
          esac

          if [[ "$DOCKERHUB_TOKEN" =~ [[:space:]] ]]; then
            echo "Docker Hub token contains whitespace"
            exit 1
          fi

          if [[ "$DOCKERHUB_TOKEN" == *$'\n'* ]]; then
            echo "Docker Hub token contains newline"
            exit 1
          fi

          if [[ "$DOCKERHUB_TOKEN" == *$'\r'* ]]; then
            echo "Docker Hub token contains carriage return"
            exit 1
          fi

          echo "Token length: ${#DOCKERHUB_TOKEN}"
          echo "Docker Hub token structure check passed"


      # --------------------------------------
      # Test Docker Hub Registry Connection
      # --------------------------------------

      - name: Test Docker Hub registry
        run: |
          echo "Testing Docker Hub registry connection..."

          curl -fsS https://registry-1.docker.io/v2/ > /dev/null

          echo "Docker Hub registry connection is working"


      # --------------------------------------
      # Login to Docker Hub
      # --------------------------------------

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin


      # --------------------------------------
      # Build & Push Backend
      # --------------------------------------

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./servicehub-backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/servicehub-backend:latest


      # --------------------------------------
      # Build & Push Frontend
      # --------------------------------------

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./servicehub-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/servicehub-frontend:latest