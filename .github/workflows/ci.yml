name: ServiceHub CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


# ==========================================
# BACKEND CHECK
# ==========================================

jobs:

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servicehub-backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check src/server.js


# ==========================================
# FRONTEND BUILD
# ==========================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servicehub-frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub-frontend/package-lock.json

      - name: Setup npm
        run: npm install -g npm@10.9.2

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build


# ==========================================
# DOCKER BUILD & PUSH TO GHCR
# ==========================================

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:

      # --------------------------------------
      # Checkout
      # --------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------
      # Convert GitHub username to lowercase
      # --------------------------------------

      - name: Set GHCR image owner
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"


      # --------------------------------------
      # Login to GitHub Container Registry
      # --------------------------------------

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------
      # Build & Push Backend
      # --------------------------------------

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./servicehub-backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/servicehub-backend:latest


      # --------------------------------------
      # Build & Push Frontend
      # --------------------------------------

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./servicehub-frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/servicehub-frontend:latest


# ==========================================
# CONTINUOUS DEPLOYMENT TO EC2
# ==========================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - docker

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # --------------------------------------
            # Go to ServiceHub directory
            # --------------------------------------

            cd ~/servicehub


            # --------------------------------------
            # Pull latest Docker images
            # --------------------------------------

            sudo docker pull ghcr.io/mkdir75/servicehub-backend:latest
            sudo docker pull ghcr.io/mkdir75/servicehub-frontend:latest


            # --------------------------------------
            # Stop old containers
            # --------------------------------------

            sudo docker stop servicehub-frontend || true
            sudo docker rm servicehub-frontend || true

            sudo docker stop servicehub-backend || true
            sudo docker rm servicehub-backend || true


            # --------------------------------------
            # Start backend
            # --------------------------------------

            sudo docker run -d \
              --name servicehub-backend \
              --restart unless-stopped \
              --env-file ~/servicehub/.env \
              --network servicehub-network \
              ghcr.io/mkdir75/servicehub-backend:latest


            # --------------------------------------
            # Start frontend
            # --------------------------------------

            sudo docker run -d \
              --name servicehub-frontend \
              --restart unless-stopped \
              --network servicehub-network \
              -p 80:80 \
              ghcr.io/mkdir75/servicehub-frontend:latest