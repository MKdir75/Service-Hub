name: ServiceHub CI/CD

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


# ==========================================
# BACKEND CHECK
# ==========================================

jobs:

  backend:
    name: Backend Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servicehub-backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check src/server.js


# ==========================================
# FRONTEND BUILD
# ==========================================

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: servicehub-frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: servicehub-frontend/package-lock.json

      - name: Setup npm
        run: npm install -g npm@10.9.2

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build


# ==========================================
# DOCKER BUILD AND PUSH
# ==========================================

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set GHCR image owner
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./servicehub-backend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/servicehub-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./servicehub-frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/servicehub-frontend:latest


# ==========================================
# DEPLOY TO AWS EC2
# ==========================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      id-token: write
      contents: read

    steps:

      # ==========================================
      # OIDC DEBUG
      # ==========================================

      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"


      # ==========================================
      # AWS OIDC AUTHENTICATION
      # ==========================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1


      # ==========================================
      # DEPLOY TO EC2 USING SSM
      # ==========================================

      - name: Deploy ServiceHub to EC2
        shell: bash
        run: |

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0208da3058680b912" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="set -e,cd ~/servicehub,sudo docker pull ghcr.io/mkdir75/servicehub-backend:latest,sudo docker pull ghcr.io/mkdir75/servicehub-frontend:latest,sudo docker stop servicehub-frontend || true,sudo docker rm servicehub-frontend || true,sudo docker stop servicehub-backend || true,sudo docker rm servicehub-backend || true,sudo docker run -d --name servicehub-backend --restart unless-stopped --env-file ~/servicehub/.env --network servicehub-network ghcr.io/mkdir75/servicehub-backend:latest,sudo docker run -d --name servicehub-frontend --restart unless-stopped --network servicehub-network -p 80:80 ghcr.io/mkdir75/servicehub-frontend:latest" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to finish..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0208da3058680b912"

          echo "Deployment command completed."

          echo "Getting deployment result..."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0208da3058680b912" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output yaml